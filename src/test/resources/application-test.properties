# Perfil de pruebas: base H2 en memoria en modo PostgreSQL, sin depender de un PostgreSQL real
# ni de la variable DB_PASSWORD. NON_KEYWORDS=VALUE: la columna "value" es palabra reservada en H2 (no en PostgreSQL).
spring.datasource.url=jdbc:h2:mem:soundia_test;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
