spring.datasource.url=jdbc:postgresql://localhost:5432/soundia_db
spring.datasource.username=soundia_user
spring.datasource.password=admin123

# Hibernate creara/actualizara la estructura de la tabla automaticamente
spring.jpa.hibernate.ddl-auto=update

# Configuracion vital para telemetria: Agrupa los INSERTs de 50 n 50 en RAM.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true