# Puerto: Render lo fija con PORT; sin esa variable, 8080.
server.port=${PORT:8080}

# Credenciales y URL de PostgreSQL desde variables de entorno (ver .env.example).
# DB_PASSWORD es obligatoria: sin ella la aplicacion no arranca.
# En local Spring lee tambien un archivo .env opcional en la raiz del proyecto (esta en .gitignore).
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soundia_db}
spring.datasource.username=${DB_USERNAME:soundia_user}
spring.datasource.password=${DB_PASSWORD}

# Autenticacion del API (ver README, seccion Autenticacion). Apagada por defecto; si se enciende, el usuario, la
# contrasena y la clave de firma son obligatorios (sin ellos la aplicacion no arranca). Se leen del entorno o del .env.
soundia.auth.enabled=${SOUNDIA_AUTH_ENABLED:false}
soundia.auth.username=${SOUNDIA_AUTH_USERNAME:}
soundia.auth.password=${SOUNDIA_AUTH_PASSWORD:}
soundia.auth.jwt-secret=${SOUNDIA_AUTH_JWT_SECRET:}

# Detras de un proxy inverso (nginx, Caddy) hay que poner SERVER_FORWARD_HEADERS_STRATEGY=framework para que el limite de
# intentos de login vea la IP real del cliente y no la del proxy. Con el valor por defecto se ignoran las cabeceras
# X-Forwarded-*; no lo actives si el puerto 8080 queda publicado, porque cualquiera podria falsificar su IP.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# Hibernate creara/actualizara la estructura de la tabla automaticamente
spring.jpa.hibernate.ddl-auto=update

# Configuracion vital para telemetria: Agrupa los INSERTs de 50 n 50 en RAM.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Subida de audio para analizar pistas (Spring limita por defecto a 1 MB). Debe ser >= AUDIO_MAX_UPLOAD_BYTES de Django.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
