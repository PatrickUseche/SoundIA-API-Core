# Levanta todo SoundIA: PostgreSQL, el motor de IA (Django), el API Gateway (Spring Boot) y el frontend (Angular).
#
# Requisitos:
#   - Los tres repositorios clonados uno junto a otro (este es SoundIA-API-Core/soundia):
#         SoundIA/SoundIA-API-Core/soundia      <- aqui esta este archivo
#         SoundIA/Soundia-IA-Engine
#         SoundIA/SoundIA-Web-DJ
#   - Un archivo .env en esta carpeta con DB_PASSWORD y DJANGO_SECRET_KEY (ver .env.example).
#
# Uso:  docker compose up --build      (frontend en http://localhost:4200, API en http://localhost:8080)
#
# NOTA: este archivo no se pudo probar al escribirlo (la maquina de desarrollo no tiene Docker).

name: soundia

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: soundia_db
      POSTGRES_USER: soundia_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundia_user -d soundia_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  ia-engine:
    build: ../../Soundia-IA-Engine
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en el archivo .env}
      # Nombres con los que otros contenedores (y el navegador, en local) pueden llamarlo.
      DJANGO_ALLOWED_HOSTS: ia-engine,localhost,127.0.0.1
    volumes:
      # La base SQLite y los audios subidos sobreviven a recrear el contenedor.
      - ia-data:/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      ia-engine:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/soundia_db
      DB_USERNAME: soundia_user
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      # Spring lee soundia.ia-engine.base-url y soundia.cors.allowed-origins de estas variables.
      SOUNDIA_IA_ENGINE_BASE_URL: http://ia-engine:8000
      SOUNDIA_CORS_ALLOWED_ORIGINS: http://localhost:4200
      # Autenticacion (apagada por defecto); para encenderla define estas variables en el .env (ver .env.example).
      SOUNDIA_AUTH_ENABLED: ${SOUNDIA_AUTH_ENABLED:-false}
      SOUNDIA_AUTH_USERNAME: ${SOUNDIA_AUTH_USERNAME:-}
      SOUNDIA_AUTH_PASSWORD: ${SOUNDIA_AUTH_PASSWORD:-}
      SOUNDIA_AUTH_JWT_SECRET: ${SOUNDIA_AUTH_JWT_SECRET:-}
    ports:
      - "8080:8080"

  web:
    build: ../../SoundIA-Web-DJ
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  db-data:
  ia-data:
